<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="background" class="bg"></div>
  <div class="bg-veil"></div>

  <header class="topbar">
    <div id="weather" class="weather"></div>
    <div class="topbar-right">
      <div id="timer" class="timer"></div>
      <button type="button" id="palette-button" class="icon-button" title="Command palette (Ctrl+K)" aria-label="Command palette">⌘</button>
      <button type="button" id="shortcuts-button" class="icon-button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">⌨</button>
      <button type="button" id="settings-button" class="icon-button" title="Settings (,)" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="content">
    <section id="clock" class="clock"></section>
    <section id="daily-focus" class="daily-focus"></section>
    <section id="search-bar" class="search-bar"></section>
    <nav id="quicklinks" class="quicklinks"></nav>
    <section id="widgets" class="widgets">
      <div id="tasks" class="widget-slot"></div>
      <div id="habits" class="widget-slot"></div>
      <div id="countdowns" class="widget-slot"></div>
      <div id="notes" class="widget-slot"></div>
      <div id="routines" class="widget-slot"></div>
    </section>
  </main>

  <p id="photo-credit" class="photo-credit"></p>
  <div id="palette-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="add-site-dialog" class="dialog">
    <form id="add-site-form" method="dialog">
      <h2 id="add-site-title">Add site</h2>
      <label>
        Name
        <input type="text" id="site-name" placeholder="e.g. GitHub" required />
      </label>
      <label>
        URL
        <input type="url" id="site-url" placeholder="https://github.com" required />
      </label>
      <label>
        Tab group
        <select id="site-group"></select>
      </label>
      <div id="site-suggest" class="site-suggest"></div>
      <div class="dialog-actions">
        <button type="button" id="cancel-add" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="group-dialog" class="dialog">
    <form id="group-form" method="dialog">
      <h2 id="group-dialog-title">New tab group</h2>
      <label>
        Name
        <input type="text" id="group-name" placeholder="e.g. Productivity" required />
      </label>
      <div class="dialog-actions">
        <button type="button" id="delete-group" class="btn btn-danger">Delete</button>
        <span class="dialog-actions-spacer"></span>
        <button type="button" id="cancel-group" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="routine-dialog" class="dialog">
    <form id="routine-form" method="dialog">
      <h2 id="routine-dialog-title">New routine</h2>
      <label>
        Name
        <input type="text" id="routine-name" placeholder="e.g. Morning" required />
      </label>
      <label>
        URLs (one per line)
        <textarea id="routine-urls" rows="5" placeholder="https://mail.google.com&#10;https://news.ycombinator.com" required></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" id="delete-routine" class="btn btn-danger">Delete</button>
        <span class="dialog-actions-spacer"></span>
        <button type="button" id="cancel-routine" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="dialog settings-dialog">
    <div class="settings-head">
      <h2>Settings</h2>
      <button type="button" id="close-settings" class="dialog-close" aria-label="Close settings">✕</button>
    </div>
    <div class="settings-body">
      <nav id="settings-tabs" class="settings-tabs" aria-label="Settings sections"></nav>
      <div id="settings-panel" class="settings-panel"></div>
    </div>
  </dialog>

  <dialog id="shortcuts-dialog" class="dialog shortcuts-dialog">
    <div class="settings-head">
      <h2>Keyboard shortcuts</h2>
      <button type="button" id="close-shortcuts" class="dialog-close" aria-label="Close shortcuts">✕</button>
    </div>
    <div id="shortcuts-list" class="shortcuts-list"></div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
